name: TRACE v0.2.6 transition package integrity

on:
  pull_request:
    paths:
      - "TRACE_FORMAL_SEED_v0_2_5.md"
      - "02_CURRENT_SURFACE/TRACE_v0_2_6_TRANSITION_CANDIDATE/**"
      - ".github/workflows/trace-v026-transition.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check transition package integrity
        run: |
          python 02_CURRENT_SURFACE/TRACE_v0_2_6_TRANSITION_CANDIDATE/validate_candidate.py
      - name: Run hostile package-integrity tests
        run: |
          python 02_CURRENT_SURFACE/TRACE_v0_2_6_TRANSITION_CANDIDATE/test_validate_candidate.py
