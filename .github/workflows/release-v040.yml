name: Publish TRACE v0.4.0 release

on:
  push:
    branches:
      - main
    paths:
      - "RELEASE_v0.4.0.md"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify release identities
        run: |
          printf '%s  %s\n' 'add22409dcc25d09b26559c7d824ddae047262ac5918a509c2a4234bdc27ce6d' TRACE-SPINE.md | sha256sum -c -
          printf '%s  %s\n' 'b9431ecc07e711c4abd1e70d4159acfd1cb8cecb8bdbd22086e8073b10c01d34' TRACE.md | sha256sum -c -
          grep -F '# TRACE // v0.4.0 SPECIFICATION // COMPACT SPINE' TRACE-SPINE.md
          grep -F 'RELEASED — FORMAL BASELINE — CURRENT SPECIFICATION — NOT VALIDATED' TRACE-SPINE.md
      - name: Create tag and GitHub release once
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.4.0 >/dev/null 2>&1; then
            echo "v0.4.0 release already exists"
            exit 0
          fi
          gh release create v0.4.0 --target "$GITHUB_SHA" --title "TRACE v0.4.0" --notes-file RELEASE_v0.4.0.md
