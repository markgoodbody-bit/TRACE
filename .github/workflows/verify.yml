name: TRACE current surface integrity

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify candidate or released v0.3.0 identity
        run: |
          python - <<'PY'
          import hashlib
          import json
          import re
          from pathlib import Path

          readme = Path('README.md').read_text(encoding='utf-8')
          spine_path = Path('TRACE-SPINE.md')
          full_path = Path('TRACE.md')
          spine = spine_path.read_text(encoding='utf-8')
          full = full_path.read_text(encoding='utf-8')

          candidate = 'RELEASE CANDIDATE / NOT RELEASED / NOT CANON / NOT VALIDATED / NO EFFICACY RESULT' in readme
          released = 'RELEASED / FORMAL BASELINE / CURRENT SPECIFICATION / NOT VALIDATED / NO EFFICACY RESULT' in readme
          if candidate == released:
              raise SystemExit('expected exactly one v0.3.0 status state')

          if candidate:
              expected = {
                  'TRACE-SPINE.md': '9ee106e98a34643929f82fa3296adffac46e650e4e8d0b775016269f0fe50999',
                  'TRACE.md': '1dfc668d3e3dc5d85dcfc8bed5a025672025aff3ce157205b55bbc5f54160a1f',
              }
              required = {
                  'TRACE-SPINE.md': '# TRACE // v0.3.0 SPECIFICATION RC1 // COMPACT SPINE',
                  'TRACE.md': '**Version:** v0.3.0 SPECIFICATION RC1',
              }
          else:
              if 'Release decision: **16 September 2026**.' not in readme:
                  raise SystemExit('released state missing release decision')
              rows = {}
              for label, digest in re.findall(r'\| (compact spine v0\.3\.0|full reference v0\.3\.0) \| [0-9,]+ \| `([0-9a-f]{64})` \|', readme):
                  rows[label] = digest
              if set(rows) != {'compact spine v0.3.0', 'full reference v0.3.0'}:
                  raise SystemExit('released README identity table incomplete')
              expected = {'TRACE-SPINE.md': rows['compact spine v0.3.0'], 'TRACE.md': rows['full reference v0.3.0']}
              required = {
                  'TRACE-SPINE.md': '# TRACE // v0.3.0 SPECIFICATION // COMPACT SPINE',
                  'TRACE.md': '**Version:** v0.3.0 SPECIFICATION — FULL REFERENCE',
              }

          for path, digest in expected.items():
              actual = hashlib.sha256(Path(path).read_bytes()).hexdigest()
              if actual != digest:
                  raise SystemExit(f'{path}: SHA-256 mismatch {actual} != {digest}')
              text = spine if path == 'TRACE-SPINE.md' else full
              if required[path] not in text:
                  raise SystemExit(f'{path}: missing status/version marker')

          for marker in ('SCHEMA_VALID != CLAIM_TRUE', 'PUBLIC_VISIBILITY != REUSE_PERMISSION'):
              if marker not in readme:
                  raise SystemExit(f'README missing ceiling: {marker}')

          fence = '`' * 3
          schema_start = full.index('## [14.4] Minimum validator contract')
          schema_match = re.search(re.escape(fence) + r'json\s*(\{.*?\})\s*' + re.escape(fence), full[schema_start:], re.S)
          if not schema_match:
              raise SystemExit('embedded minimum schema not found')
          schema = json.loads(schema_match.group(1))

          def normalize_version(value):
              if isinstance(value, dict): return {k: normalize_version(v) for k, v in value.items()}
              if isinstance(value, list): return [normalize_version(v) for v in value]
              if isinstance(value, str): return value.replace('0.3.0', '0.2.7')
              return value

          observed = hashlib.sha256(json.dumps(normalize_version(schema), sort_keys=True, separators=(',', ':'), ensure_ascii=False).encode()).hexdigest()
          expected_schema = 'd1b0705d0c5c199532d591f99b6cc7fd86476488b5eb134f7a10d32794afe142'
          if observed != expected_schema:
              raise SystemExit('embedded schema no longer matches normalized v0.2.7 shape: ' + observed)

          for text, name in ((spine, 'TRACE-SPINE.md'), (full, 'TRACE.md')):
              if text.count(fence) % 2:
                  raise SystemExit(f'{name}: unbalanced fenced blocks')
              ids = re.findall(r'(?m)^#{1,6} \[([0-9]+(?:\.[0-9]+)*)\]', text)
              dup = sorted({x for x in ids if ids.count(x) > 1})
              if dup:
                  raise SystemExit(f'{name}: duplicate numbered headings: {dup}')

          print('TRACE v0.3.0 candidate/release-boundary integrity passed')
          PY
      - name: Check whitespace integrity
        run: git diff --check
      - name: Claim boundary
        run: |
          echo "Green verifies controlled repository objects and the pinned normalized minimum-schema shape."
          echo "It does not establish semantic correctness, efficacy, validation, authority, permission or clearance."
