name: TRACE v0.3.0 F03 one-shot full-candidate build

on:
  push:
    branches:
      - framework/trace-v0-3-0-working
    paths:
      - .github/workflows/trace-v030-f03-build-once.yml

permissions:
  contents: write

jobs:
  build-f03:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: framework/trace-v0-3-0-working

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify released-donor section manifest
        run: python tools/build_trace_v027_section_manifest.py --check --report /tmp/trace-v027-section-manifest-check.json

      - name: Verify version-only minimum schema
        run: python tools/build_trace_v030_minimum_schema.py --check --report /tmp/trace-v030-minimum-schema-check.json

      - name: Build F03 full working candidate deterministically
        run: python tools/compile_trace_v030_full_candidate.py --write --report /tmp/trace-v030-full-build.json

      - name: Re-run deterministic check against generated files
        run: python tools/compile_trace_v030_full_candidate.py --check --report /tmp/trace-v030-full-check.json

      - name: Check whitespace integrity
        run: git diff --check

      - name: Commit generated F03 candidate and report if changed
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            PROJECT/TRACE_FORMAL_SEED_v0_3_0_FULL_WORKING_CANDIDATE_v0_1.md \
            PROJECT/TRACE_v0_3_0_FULL_CANDIDATE_BUILD_REPORT_v0_1.json
          if git diff --cached --quiet; then
            echo 'Generated candidate already matches deterministic F03 output.'
          else
            git commit -m 'Build full v0.3 candidate after F03 repair'
            git push origin HEAD:framework/trace-v0-3-0-working
          fi

      - name: Claim boundary
        run: |
          echo 'Green means deterministic donor/schema/build/check execution after F03.'
          echo 'It does not establish semantic correctness, validation, release or canon.'
