name: TRACE v0.3.0 F08 one-shot migration and build

on:
  push:
    branches:
      - framework/trace-v0-3-0-working
    paths:
      - .github/workflows/trace-v030-f08-build-once.yml

permissions:
  contents: write

jobs:
  migrate-and-build-f08:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: framework/trace-v0-3-0-working

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply exact fail-closed F08 migration
        run: python tools/migrate_trace_v030_full_candidate_f08.py

      - name: Require compiler delta and clean patch
        shell: bash
        run: |
          git diff --check
          if git diff --quiet -- tools/compile_trace_v030_full_candidate.py; then
            echo 'F08 migration produced no compiler delta.' >&2
            exit 1
          fi

      - name: Verify released-donor section manifest
        run: python tools/build_trace_v027_section_manifest.py --check --report /tmp/trace-v027-section-manifest-check.json

      - name: Verify version-only minimum schema
        run: python tools/build_trace_v030_minimum_schema.py --check --report /tmp/trace-v030-minimum-schema-check.json

      - name: Build F08 full working candidate deterministically
        run: python tools/compile_trace_v030_full_candidate.py --write --report /tmp/trace-v030-full-build.json

      - name: Re-run deterministic check against generated files
        run: python tools/compile_trace_v030_full_candidate.py --check --report /tmp/trace-v030-full-check.json

      - name: Check final whitespace integrity
        run: git diff --check

      - name: Commit F08 compiler repair and generated object
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            tools/compile_trace_v030_full_candidate.py \
            PROJECT/TRACE_FORMAL_SEED_v0_3_0_FULL_WORKING_CANDIDATE_v0_1.md \
            PROJECT/TRACE_v0_3_0_FULL_CANDIDATE_BUILD_REPORT_v0_1.json
          if git diff --cached --quiet; then
            echo 'F08 migration/build produced no committed delta.' >&2
            exit 1
          fi
          git commit -m 'Expose recursive entry-budget termination after F08'
          git push origin HEAD:framework/trace-v0-3-0-working

      - name: Claim boundary
        run: |
          echo 'Green means exact F08 migration plus deterministic donor/schema/build/check execution.'
          echo 'It does not establish semantic correctness, validation, release or canon.'
