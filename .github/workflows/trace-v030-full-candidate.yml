name: TRACE v0.3.0 full working candidate

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/compile_trace_v030_full_candidate.py'
      - 'tools/build_trace_v027_section_manifest.py'
      - 'tools/build_trace_v030_minimum_schema.py'
      - 'TRACE_FORMAL_SEED_v0_2_7.md'
      - 'PROJECT/TRACE_v0_2_7_SECTION_MANIFEST_v0_1.json'
      - 'PROJECT/TRACE_v0_3_0_MINIMUM_SCHEMA_CANDIDATE_v0_1.json'
      - 'PROJECT/TRACE_v0_3_0_MINIMUM_SCHEMA_BUILD_REPORT_v0_1.json'
      - 'PROJECT/TRACE_v0_3_0_FULL_CANDIDATE_TRANSFORMATION_MANIFEST_v0_2.md'
      - 'PROJECT/TRACE_v0_3_0_FULL_CANDIDATE_INGRESS_ADMISSION_REPAIR_v0_1.md'
      - 'PROJECT/TRACE_v0_3_0_REMAINING_TRANSFORM_CLASSES_v0_1.md'
      - 'PROJECT/TRACE_v0_3_0_FULL_CANDIDATE_T_CLOCK_ROUTE_v0_1.md'
      - 'PROJECT/TRACE_v0_3_0_FULL_CANDIDATE_T_CLAIM_EVIDENCE_v0_1.md'
      - '.github/workflows/trace-v030-full-candidate.yml'
  pull_request:
    paths:
      - 'tools/compile_trace_v030_full_candidate.py'
      - 'TRACE_FORMAL_SEED_v0_2_7.md'
      - 'PROJECT/TRACE_v0_2_7_SECTION_MANIFEST_v0_1.json'
      - 'PROJECT/TRACE_v0_3_0_MINIMUM_SCHEMA_CANDIDATE_v0_1.json'
      - 'PROJECT/TRACE_v0_3_0_MINIMUM_SCHEMA_BUILD_REPORT_v0_1.json'
      - 'PROJECT/TRACE_v0_3_0_FULL_CANDIDATE_TRANSFORMATION_MANIFEST_v0_2.md'
      - 'PROJECT/TRACE_v0_3_0_FULL_CANDIDATE_INGRESS_ADMISSION_REPAIR_v0_1.md'
      - 'PROJECT/TRACE_v0_3_0_REMAINING_TRANSFORM_CLASSES_v0_1.md'
      - 'PROJECT/TRACE_v0_3_0_FULL_CANDIDATE_T_CLOCK_ROUTE_v0_1.md'
      - 'PROJECT/TRACE_v0_3_0_FULL_CANDIDATE_T_CLAIM_EVIDENCE_v0_1.md'
      - '.github/workflows/trace-v030-full-candidate.yml'

permissions:
  contents: write

jobs:
  build-full-candidate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply exact compiler anchor-count migration
        if: github.event_name == 'push'
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tools/compile_trace_v030_full_candidate.py')
          text = p.read_text(encoding='utf-8')
          old = '    b.replace_once("T_VERSION_IDENTITY", \'trace_version: "0.2.7"\', \'trace_version: "0.3.0"\')'
          new = '    b.replace_all_exact("T_VERSION_IDENTITY", \'trace_version: "0.2.7"\', \'trace_version: "0.3.0"\', expected=2)'
          old_count = text.count(old)
          new_count = text.count(new)
          if old_count == 1 and new_count == 0:
              p.write_text(text.replace(old, new, 1), encoding='utf-8')
              print('Applied exact count=2 migration.')
          elif old_count == 0 and new_count == 1:
              print('Exact count=2 migration already present.')
          else:
              raise SystemExit(f'Unexpected migration state: old={old_count} new={new_count}')
          PY

      - name: Commit exact compiler repair if needed
        id: compiler_repair
        if: github.event_name == 'push'
        shell: bash
        run: |
          if git diff --quiet -- tools/compile_trace_v030_full_candidate.py; then
            echo 'committed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/compile_trace_v030_full_candidate.py
          git commit -m 'Fix TRACE v0.3 packet version anchor count'
          git push
          echo 'committed=true' >> "$GITHUB_OUTPUT"

      - name: Verify released-donor section manifest
        if: steps.compiler_repair.outputs.committed != 'true'
        run: |
          python tools/build_trace_v027_section_manifest.py --check --report /tmp/trace-v027-section-manifest-check.json

      - name: Verify version-only minimum schema
        if: steps.compiler_repair.outputs.committed != 'true'
        run: |
          python tools/build_trace_v030_minimum_schema.py --check --report /tmp/trace-v030-minimum-schema-check.json

      - name: Build full working candidate deterministically
        if: steps.compiler_repair.outputs.committed != 'true'
        run: |
          python tools/compile_trace_v030_full_candidate.py --write --report /tmp/trace-v030-full-build.json

      - name: Re-run deterministic check against generated files
        if: steps.compiler_repair.outputs.committed != 'true'
        run: |
          python tools/compile_trace_v030_full_candidate.py --check --report /tmp/trace-v030-full-check.json

      - name: Commit generated full candidate and build report if changed
        if: github.event_name == 'push' && steps.compiler_repair.outputs.committed != 'true'
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            PROJECT/TRACE_FORMAL_SEED_v0_3_0_FULL_WORKING_CANDIDATE_v0_1.md \
            PROJECT/TRACE_v0_3_0_FULL_CANDIDATE_BUILD_REPORT_v0_1.json
          if git diff --cached --quiet; then
            echo 'Generated candidate already matches deterministic output.'
            exit 0
          fi
          git commit -m 'Build TRACE v0.3.0 full working candidate v0.1'
          git push
