name: TRACE v0.3.0 F03 one-shot compiler migration

on:
  push:
    branches:
      - framework/trace-v0-3-0-working
    paths:
      - .github/workflows/trace-v030-f03-migration-once.yml

permissions:
  contents: write

jobs:
  migrate-f03:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: framework/trace-v0-3-0-working

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply exact fail-closed F03 migration
        run: python tools/migrate_trace_v030_full_candidate_f03.py

      - name: Check whitespace integrity
        run: git diff --check

      - name: Require compiler delta
        shell: bash
        run: |
          if git diff --quiet -- tools/compile_trace_v030_full_candidate.py; then
            echo 'F03 migration produced no compiler delta.' >&2
            exit 1
          fi

      - name: Commit compiler migration only
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/compile_trace_v030_full_candidate.py
          git commit -m 'Apply F03 recursive target-selection binding'
          git push origin HEAD:framework/trace-v0-3-0-working

      - name: Claim boundary
        run: |
          echo 'This run only applies the preserved F03 compiler migration.'
          echo 'It does not establish compiler pass, candidate correctness, validation, release or canon.'
