name: TD-TSET accounting candidate

on:
  pull_request:
    paths:
      - "checker_external/td_tset_accounting_001/**"
      - "TRACE_FORMAL_SEED_v0_2_5.md"
      - ".github/workflows/td-tset-accounting.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: |
          python -m pip install --disable-pip-version-check \
            -r checker_external/td_tset_accounting_001/requirements-test.txt
      - name: Run unit regressions
        run: |
          python checker_external/td_tset_accounting_001/test_checker.py
          python checker_external/td_tset_accounting_001/test_integrity.py
          python checker_external/td_tset_accounting_001/test_run_suite.py
          python checker_external/td_tset_accounting_001/test_applied_scene.py
          python checker_external/td_tset_accounting_001/test_search_coverage.py
          python checker_external/td_tset_accounting_001/test_search_coverage_integrity.py
          python checker_external/td_tset_accounting_001/test_run_search_coverage.py
      - name: Run fixture bundles
        run: |
          python checker_external/td_tset_accounting_001/checker.py checker_external/td_tset_accounting_001/fixtures.json --all
          python checker_external/td_tset_accounting_001/integrity.py checker_external/td_tset_accounting_001/fixtures_hostile.json --all
          python checker_external/td_tset_accounting_001/run_suite.py regress
          python checker_external/td_tset_accounting_001/minimum_schema.py
          python checker_external/td_tset_accounting_001/search_coverage.py
          python checker_external/td_tset_accounting_001/run_search_coverage.py regress
