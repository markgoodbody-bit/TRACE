name: Publish TRACE v0.5.0 release

on:
  push:
    branches: [main]
    paths: ["RELEASE_v0.5.0.md"]

permissions:
  contents: write

concurrency:
  group: trace-v050-publication
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify exact released source and retained identities
        run: python checks/verify_v050.py
      - name: Publish exact tag once without replacing existing objects
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if git show-ref --verify --quiet refs/tags/v0.5.0; then
            test "$(git rev-list -n 1 v0.5.0)" = "$GITHUB_SHA"
          else
            git tag v0.5.0 "$GITHUB_SHA"
            git push origin refs/tags/v0.5.0
          fi
          if gh release view v0.5.0 --json isDraft,isPrerelease,tagName > /tmp/trace-release.json 2>/dev/null; then
            python -c 'import json; d=json.load(open("/tmp/trace-release.json")); assert d["tagName"]=="v0.5.0" and not d["isDraft"] and not d["isPrerelease"]'
            echo "Existing release retained without modification"
          else
            gh release create v0.5.0 --verify-tag --title "TRACE v0.5.0" --notes-file RELEASE_v0.5.0.md --latest
          fi
