name: TRACE v0.2.7 section manifest

on:
  push:
    branches:
      - framework/trace-v0-3-0-working
    paths:
      - tools/build_trace_v027_section_manifest.py
      - TRACE_FORMAL_SEED_v0_2_7.md
      - PROJECT/TRACE_v0_2_7_SECTION_MANIFEST_v0_1.json
      - .github/workflows/trace-v027-section-manifest.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: framework/trace-v0-3-0-working

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build deterministic donor section manifest
        run: |
          python tools/build_trace_v027_section_manifest.py \
            --write \
            --report /tmp/trace-v027-section-manifest-first.json

      - name: Check whitespace integrity
        run: git diff --check

      - name: Commit deterministic manifest when changed
        run: |
          if [ -n "$(git status --porcelain -- PROJECT/TRACE_v0_2_7_SECTION_MANIFEST_v0_1.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add PROJECT/TRACE_v0_2_7_SECTION_MANIFEST_v0_1.json
            git commit -m "Compile TRACE v0.2.7 section manifest"
            git push origin HEAD:framework/trace-v0-3-0-working
          else
            echo "Committed donor section manifest already matches builder."
          fi

      - name: Verify committed deterministic manifest
        run: |
          python tools/build_trace_v027_section_manifest.py \
            --check \
            --report /tmp/trace-v027-section-manifest-final.json

      - name: Upload section manifest report
        uses: actions/upload-artifact@v4
        with:
          name: trace-v027-section-manifest
          path: /tmp/trace-v027-section-manifest-final.json
          if-no-files-found: error

      - name: Claim boundary
        run: |
          echo "Green means the released donor hash was verified and heading/section spans were enumerated deterministically."
          echo "It does not classify semantic importance, equivalence, release, canon or validation."
