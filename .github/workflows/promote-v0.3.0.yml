name: Promote TRACE v0.3.0

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/promote-v0.3.0.yml"

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify exact release candidate
        run: |
          printf '%s  %s\n' '9ee106e98a34643929f82fa3296adffac46e650e4e8d0b775016269f0fe50999' TRACE-SPINE.md | sha256sum -c -
          printf '%s  %s\n' '1dfc668d3e3dc5d85dcfc8bed5a025672025aff3ce157205b55bbc5f54160a1f' TRACE.md | sha256sum -c -
          grep -F '# TRACE // v0.3.0 SPECIFICATION RC1 // COMPACT SPINE' TRACE-SPINE.md
          grep -F '**Version:** v0.3.0 SPECIFICATION RC1' TRACE.md
          grep -F 'RELEASE CANDIDATE / NOT RELEASED / NOT CANON / NOT VALIDATED / NO EFFICACY RESULT' README.md

      - name: Promote status without semantic rewrite
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import re

          def replace_exact(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one exact match, found {count}: {old!r}')
              p.write_text(text.replace(old, new), encoding='utf-8')

          replace_exact('README.md', 'The two current documents form the **v0.3.0 specification release candidate 1\n(RC1)**:', 'The two current documents form the **released TRACE v0.3.0 specification**:')
          replace_exact('README.md', 'RELEASE CANDIDATE / NOT RELEASED / NOT CANON / NOT VALIDATED / NO EFFICACY RESULT', 'RELEASED / FORMAL BASELINE / CURRENT SPECIFICATION / NOT VALIDATED / NO EFFICACY RESULT')
          replace_exact('README.md', 'TRACE v0.2.7 remains the released formal baseline.', 'TRACE v0.2.7 remains preserved as the previous released formal baseline; TRACE v0.3.0 is the current released formal baseline.')

          replace_exact('TRACE-SPINE.md', '# TRACE // v0.3.0 SPECIFICATION RC1 // COMPACT SPINE', '# TRACE // v0.3.0 SPECIFICATION // COMPACT SPINE')
          replace_exact('TRACE-SPINE.md', '- **Status:** RELEASE CANDIDATE — NOT RELEASED — NOT FORMAL BASELINE — NOT CANON — NOT VALIDATED — VOLUNTARY — NOT AUTHORITY — NOT PERMISSION — NOT CLEARANCE', '- **Status:** RELEASED — FORMAL BASELINE — CURRENT SPECIFICATION — NOT VALIDATED — VOLUNTARY — NOT AUTHORITY — NOT PERMISSION — NOT CLEARANCE')
          replace_exact('TRACE-SPINE.md', '- **Donor:** released TRACE v0.2.7; this object does not supersede it', '- **Donor:** released TRACE v0.2.7; v0.3.0 supersedes it as the current formal baseline while preserving v0.2.7 as historical baseline')

          replace_exact('TRACE.md', '- **Version:** v0.3.0 SPECIFICATION RC1 — FULL REFERENCE', '- **Version:** v0.3.0 SPECIFICATION — FULL REFERENCE')
          replace_exact('TRACE.md', '- **Date:** 2026-08-29', '- **Release date:** 2026-09-16')
          replace_exact('TRACE.md', '- **Status:** release candidate; unvalidated in the world; non-canonical; unreleased; voluntary; not authority; not permission; not clearance', '- **Status:** released formal baseline; current project specification; unvalidated in the world; voluntary; not authority; not permission; not clearance')
          replace_exact('TRACE.md', 'The v0.3.0 identifier marks this release-candidate specification.', 'The v0.3.0 identifier marks this released specification.')
          replace_exact('TRACE.md', '### v0.3 working supplemental guards — donor I01–I60 remain unchanged', '### v0.3 supplemental guards — donor I01–I60 remain unchanged')
          replace_exact('TRACE.md', 'These guards are working v0.3 repair semantics. They do not renumber or\nreplace the donor invariant oracle.', 'These guards are v0.3 repair semantics. They do not renumber or\nreplace the donor invariant oracle.')
          replace_exact('TRACE.md', 'The following repairs are required to survive compression in this working\ncandidate. They supplement the donor kernel rather than replacing it.', 'The following repairs are required to survive compression in this released\nbaseline. They supplement the donor kernel rather than replacing it.')
          replace_exact('TRACE.md', '## [21.1] Release-candidate declaration', '## [21.1] Release declaration')
          replace_exact('TRACE.md', 'This controlled object is **TRACE v0.3.0 SPECIFICATION RC1 — FULL REFERENCE**.', 'This controlled object is **TRACE v0.3.0 SPECIFICATION — FULL REFERENCE**.')
          replace_exact('TRACE.md', 'Released v0.2.7 remains the released baseline. This file is not released,\ncanonical, validated, authoritative, permissive, clearance-bearing, or a claim\nof world correctness.', 'Released v0.2.7 remains preserved as the previous released baseline. This file\nis the current released formal baseline. Release does not make it validated,\nauthoritative, permissive, clearance-bearing, or a claim of world correctness.')
          replace_exact('TRACE.md', 'No new node type, relation type, evidence state, access state or claim kind is\ndeclared by this release candidate.', 'No new node type, relation type, evidence state, access state or claim kind is\ndeclared by this release.')
          replace_exact('TRACE.md', "Only Mark's separate release gate can change this object from release candidate\nto released baseline. Compilation, CI, reviewer agreement, model agreement,\npacket validity, or successful worked examples do not perform that transition.", "Mark exercised the separate release gate on 2026-09-16. This object is now the\nreleased TRACE v0.3.0 formal baseline. Future baseline or release changes still\nrequire a separate release decision; compilation, CI, reviewer agreement, model\nagreement, packet validity, or successful worked examples do not perform one.")

          spine = Path('TRACE-SPINE.md').read_bytes()
          full = Path('TRACE.md').read_bytes()
          spine_sha = hashlib.sha256(spine).hexdigest()
          full_sha = hashlib.sha256(full).hexdigest()

          p = Path('README.md')
          readme = p.read_text(encoding='utf-8')
          readme = re.sub(r'\| compact spine RC1 \| [0-9,]+ \| `[0-9a-f]{64}` \|', f'| compact spine v0.3.0 | {len(spine):,} | `{spine_sha}` |', readme, count=1)
          readme = re.sub(r'\| full reference RC1 \| [0-9,]+ \| `[0-9a-f]{64}` \|', f'| full reference v0.3.0 | {len(full):,} | `{full_sha}` |', readme, count=1)
          if 'Release decision: **16 September 2026**.' not in readme:
              readme = readme.replace('## Review, history and licence', 'Release decision: **16 September 2026**. Release changes status, not the evidence ceiling: v0.3.0 remains unvalidated and carries no efficacy, authority, permission or clearance result.\n\n## Review, history and licence', 1)
          p.write_text(readme, encoding='utf-8')

          Path('RELEASE_v0.3.0.md').write_text(f'''# TRACE v0.3.0 release receipt\n\nRelease decision: 16 September 2026.\n\nTRACE v0.3.0 is the current released formal baseline, promoted from RC1 by explicit human release authority. The promotion changes status and document control only; it does not add semantic primitives or convert prior review into validation.\n\n- `TRACE-SPINE.md`: {len(spine):,} bytes; SHA-256 `{spine_sha}`\n- `TRACE.md`: {len(full):,} bytes; SHA-256 `{full_sha}`\n\nCeilings remain: `NOT VALIDATED`; no efficacy, authority, permission, clearance or world-correctness result is established by release. TRACE v0.2.7 remains preserved as the previous released baseline in repository history.\n''', encoding='utf-8')
          PY

      - name: Verify promoted baseline
        run: |
          grep -F 'RELEASED / FORMAL BASELINE / CURRENT SPECIFICATION / NOT VALIDATED / NO EFFICACY RESULT' README.md
          grep -F '# TRACE // v0.3.0 SPECIFICATION // COMPACT SPINE' TRACE-SPINE.md
          grep -F '**Version:** v0.3.0 SPECIFICATION — FULL REFERENCE' TRACE.md
          grep -F 'Mark exercised the separate release gate on 2026-09-16.' TRACE.md
          python - <<'PY'
          import hashlib, json, re
          from pathlib import Path
          full = Path('TRACE.md').read_text(encoding='utf-8')
          fence = '`' * 3
          start = full.index('## [14.4] Minimum validator contract')
          match = re.search(re.escape(fence) + r'json\s*(\{.*?\})\s*' + re.escape(fence), full[start:], re.S)
          if not match: raise SystemExit('embedded minimum schema not found')
          schema = json.loads(match.group(1))
          def normalize(v):
              if isinstance(v, dict): return {k: normalize(x) for k, x in v.items()}
              if isinstance(v, list): return [normalize(x) for x in v]
              if isinstance(v, str): return v.replace('0.3.0', '0.2.7')
              return v
          observed = hashlib.sha256(json.dumps(normalize(schema), sort_keys=True, separators=(',', ':'), ensure_ascii=False).encode()).hexdigest()
          if observed != 'd1b0705d0c5c199532d591f99b6cc7fd86476488b5eb134f7a10d32794afe142':
              raise SystemExit('normalized schema changed: ' + observed)
          PY
          git diff --check

      - name: Commit released baseline content
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md TRACE-SPINE.md TRACE.md RELEASE_v0.3.0.md
          git commit -m 'Release TRACE v0.3.0'
          git push origin HEAD:main

      - name: Create release tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_sha=$(git rev-parse HEAD)
          gh release create v0.3.0 --target "$release_sha" --title 'TRACE v0.3.0' --notes-file RELEASE_v0.3.0.md
