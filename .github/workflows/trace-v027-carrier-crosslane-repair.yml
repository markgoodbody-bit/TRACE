name: TRACE v0.2.7 carrier cross-lane repair

on:
  push:
    branches:
      - framework/trace-v0-2-7-pdf-carrier
    paths:
      - .github/workflows/trace-v027-carrier-crosslane-repair.yml
      - tools/apply_trace_v027_crosslane_repair.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Normalize prior report status and apply bounded repair
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('TRACE_v0_2_7_RENDERED_CARRIER_REPORT.md')
          text = path.read_text(encoding='utf-8')
          current = '**Status:** exact binary visually reviewed; bounded Windows-checkout repair applied; post-repair exact-head recheck pending  '
          expected = '**Status:** exact binary visually reviewed; independent exact-head review pending  '
          if text.count(current) != 1:
              raise SystemExit(f'prior report status: expected 1 match, found {text.count(current)}')
          path.write_text(text.replace(current, expected, 1), encoding='utf-8')
          PY
          python tools/apply_trace_v027_crosslane_repair.py

      - name: Run repaired v0.2.7 instrument
        run: |
          python falsification/run_trace_v027_falsify_x100.py \
            --strict \
            --json-out /tmp/trace-v027-crosslane-repair.json

      - name: Observe preserved v0.2.6 instrument without changing its historical scope
        run: |
          python falsification/run_trace_v026_falsify_x100.py \
            --json-out /tmp/trace-v026-current-observation.json

      - name: Check diff integrity
        run: git diff --check

      - name: Commit bounded repair and remove one-shot inputs
        run: |
          rm .github/workflows/trace-v027-carrier-crosslane-repair.yml
          rm tools/apply_trace_v027_crosslane_repair.py
          git config user.name "Framework cross-lane repair"
          git config user.email "framework-repair@users.noreply.github.com"
          git add -A
          git commit -m "Synchronize v0.2.7 carrier and falsification front door"
          git push origin HEAD:framework/trace-v0-2-7-pdf-carrier

      - name: Upload repair evidence
        uses: actions/upload-artifact@v4
        with:
          name: trace-v027-carrier-crosslane-repair
          path: |
            /tmp/trace-v027-crosslane-repair.json
            /tmp/trace-v026-current-observation.json
          if-no-files-found: error

      - name: Claim boundary
        run: |
          echo "This repair re-points live probes to the post-carrier repository state."
          echo "It does not change the formal seed or PDF binary and does not validate TRACE."
