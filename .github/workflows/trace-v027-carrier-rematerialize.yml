name: TRACE v0.2.7 carrier rematerializer

on:
  push:
    branches:
      - framework/trace-v0-2-7-pdf-carrier
    paths:
      - .github/workflows/trace-v027-carrier-rematerialize.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rematerialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install render and verification dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pandoc texlive-xetex texlive-latex-extra \
            texlive-fonts-recommended lmodern \
            fonts-dejavu-core poppler-utils
          python -m pip install --disable-pip-version-check PyMuPDF Pillow

      - name: Remove duplicate pre-title TOC generation
        run: |
          python - <<'PY'
          from pathlib import Path

          script = Path('tools/build_trace_v027_carrier.py')
          text = script.read_text(encoding='utf-8')
          old = '            "--toc",\n            "--toc-depth=4",\n'
          if text.count(old) != 1:
              raise SystemExit('expected one automatic TOC argument pair')
          script.write_text(text.replace(old, ''), encoding='utf-8')

          header = Path('carrier/trace_v027_carrier_header.tex')
          text = header.read_text(encoding='utf-8')
          anchor = '\\allowdisplaybreaks\n'
          addition = '\\allowdisplaybreaks\n\\setcounter{tocdepth}{4}\n'
          if text.count(anchor) != 1:
              raise SystemExit('expected one header insertion anchor')
          header.write_text(text.replace(anchor, addition), encoding='utf-8')
          PY

      - name: Build corrected rendered carrier
        run: |
          python - <<'PY'
          from pathlib import Path
          from tools.build_trace_v027_carrier import build_pdf
          build_pdf(Path('TRACE.pdf'))
          PY

      - name: Bind exact corrected render identities
        run: |
          python - <<'PY'
          import hashlib
          import json
          import re
          from pathlib import Path
          import fitz
          from tools.build_trace_v027_carrier import extract_pdf_text, normalize_text

          pdf_path = Path('TRACE.pdf')
          raw = pdf_path.read_bytes()
          pdf_sha = hashlib.sha256(raw).hexdigest()
          pdf_blob = hashlib.sha1(f'blob {len(raw)}\0'.encode() + raw).hexdigest()
          pages = fitz.open(pdf_path).page_count
          normalized = normalize_text(extract_pdf_text(pdf_path))
          text_hash = hashlib.sha256(normalized.encode('utf-8')).hexdigest()

          script = Path('tools/build_trace_v027_carrier.py')
          text = script.read_text(encoding='utf-8')
          text, n1 = re.subn(r'EXPECTED_PAGES = \d+', f'EXPECTED_PAGES = {pages}', text, count=1)
          text, n2 = re.subn(
              r'EXPECTED_NORMALIZED_TEXT_SHA256 = "[0-9a-f]{64}"',
              f'EXPECTED_NORMALIZED_TEXT_SHA256 = "{text_hash}"',
              text,
              count=1,
          )
          if (n1, n2) != (1, 1):
              raise SystemExit(f'failed to bind builder constants: {(n1, n2)}')
          script.write_text(text, encoding='utf-8')

          manifest_path = Path('carrier/trace_v027_carrier_manifest.json')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          manifest.update({
              'expected_pages': pages,
              'expected_normalized_text_sha256': text_hash,
              'pdf_path': 'TRACE.pdf',
              'pdf_sha256': pdf_sha,
              'pdf_git_blob': pdf_blob,
              'pdf_size_bytes': len(raw),
              'page_count': pages,
              'page_geometry': 'A4',
              'visual_qa_layout_repair': 'removed duplicate automatic pre-title TOC; retained one explicit TOC after title page',
          })
          manifest_path.write_text(json.dumps(manifest, indent=2, sort_keys=True) + '\n', encoding='utf-8')

          report_path = Path('TRACE_v0_2_7_RENDERED_CARRIER_REPORT.md')
          report = report_path.read_text(encoding='utf-8')
          report = report.replace('95df4b1fbca840f7738117ea49e1be1c00f8e4a87c5ac954a856d9e4029f7e75', pdf_sha)
          report = report.replace('7f6e2f8492b5df83da7fe9e50d7d19cf0d378fdf', pdf_blob)
          report = report.replace('size: 313754 bytes', f'size: {len(raw)} bytes')
          report = report.replace('pages: 76', f'pages: {pages}')
          report = report.replace('page count: 76', f'page count: {pages}')
          report = report.replace('9345c6d8e73df9b71a3d0c2ee666f96f0f4a6ab5a3aec9489dd3492f66c35a33', text_hash)
          marker = 'No symbol, predicate, relation, claim, identifier, schema field, invariant, example, or prose proposition is added or removed by those repairs.\n'
          addition = marker + '\nThe carrier layout contains one table of contents after the title page. A duplicate Pandoc-generated pre-title table of contents exposed during exact-binary visual QA was removed before review.\n'
          if report.count(marker) != 1:
              raise SystemExit('expected one report layout marker')
          report = report.replace(marker, addition)
          report_path.write_text(report, encoding='utf-8')

          Path('/tmp/corrected-carrier-identities.json').write_text(json.dumps({
              'pages': pages,
              'pdf_sha256': pdf_sha,
              'pdf_git_blob': pdf_blob,
              'pdf_size_bytes': len(raw),
              'normalized_text_sha256': text_hash,
          }, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print(json.dumps({'pages': pages, 'pdf_sha256': pdf_sha, 'text_sha256': text_hash}, indent=2))
          PY

      - name: Verify exact corrected binary
        run: |
          python tools/build_trace_v027_carrier.py \
            --check-source \
            --verify-committed \
            --report /tmp/trace-v027-carrier-corrected.json
          git diff --check

      - name: Commit corrected carrier and remove one-shot workflow
        run: |
          rm -rf tools/__pycache__
          rm .github/workflows/trace-v027-carrier-rematerialize.yml
          git config user.name "Framework carrier build"
          git config user.email "framework-carrier@users.noreply.github.com"
          git add -A
          git commit -m "Correct TRACE v0.2.7 carrier document order"
          git push origin HEAD:framework/trace-v0-2-7-pdf-carrier

      - name: Upload corrected exact carrier evidence
        uses: actions/upload-artifact@v4
        with:
          name: trace-v027-corrected-carrier
          path: |
            TRACE.pdf
            carrier/TRACE_v0_2_7_RENDERED_CARRIER_SOURCE.md
            carrier/trace_v027_carrier_manifest.json
            TRACE_v0_2_7_RENDERED_CARRIER_REPORT.md
            /tmp/corrected-carrier-identities.json
            /tmp/trace-v027-carrier-corrected.json
          if-no-files-found: error

      - name: Claim boundary
        run: |
          echo "The corrected carrier changes document order and presentation only."
          echo "It does not establish canon, validation, world validity, authority, permission or clearance."
