name: TRACE v0.3.0 invariant lexical coverage

on:
  push:
    branches:
      - framework/trace-v0-3-0-working
    paths:
      - tools/check_trace_v030_invariant_lexical_coverage.py
      - TRACE_FORMAL_SEED_v0_2_7.md
      - PROJECT/TRACE_v0_3_0_SPINE_CANDIDATE_v0_10.md
      - PROJECT/TRACE_v0_3_0_INVARIANT_LEXICAL_COVERAGE_v0_3.json
      - .github/workflows/trace-v030-invariant-lexical-coverage.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  invariant-coverage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: framework/trace-v0-3-0-working

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build deterministic lexical coverage report
        run: |
          python tools/check_trace_v030_invariant_lexical_coverage.py \
            --write \
            --report /tmp/trace-v030-invariant-lexical-first.json

      - name: Check whitespace integrity
        run: git diff --check

      - name: Commit deterministic coverage report when changed
        run: |
          if [ -n "$(git status --porcelain -- PROJECT/TRACE_v0_3_0_INVARIANT_LEXICAL_COVERAGE_v0_3.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add PROJECT/TRACE_v0_3_0_INVARIANT_LEXICAL_COVERAGE_v0_3.json
            git commit -m "Compile TRACE v0.3.0 invariant lexical coverage v0.3"
            git push origin HEAD:framework/trace-v0-3-0-working
          else
            echo "Committed invariant lexical coverage v0.3 already matches checker."
          fi

      - name: Verify committed deterministic report
        run: |
          python tools/check_trace_v030_invariant_lexical_coverage.py \
            --check \
            --report /tmp/trace-v030-invariant-lexical-final.json

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: trace-v030-invariant-lexical-coverage-v03
          path: /tmp/trace-v030-invariant-lexical-final.json
          if-no-files-found: error

      - name: Claim boundary
        run: |
          echo "Green means I01-I60 were extracted deterministically and exact expression presence was counted against spine v0.10."
          echo "Missing exact text does not prove semantic loss; present exact text does not prove firing or validity."
